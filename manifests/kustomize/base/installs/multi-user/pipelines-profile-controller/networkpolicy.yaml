apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubeflow-pipelines-profile-controller
spec:
  # The sync webhook served by this pod has no authentication of its own: it
  # trusts the namespace named in the request body, mints SeaweedFS IAM
  # credentials for it and returns them in the response. Only metacontroller
  # may call it, so restrict ingress to metacontroller pods in this namespace.
  # Selectors use matchExpressions so kustomize label transformers do not add
  # labels that metacontroller pods do not carry.
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - metacontroller
    ports:
    - port: 8080
      protocol: TCP
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - kubeflow-pipelines-profile-controller
  policyTypes:
  - Ingress
